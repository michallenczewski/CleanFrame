<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafle</title>
<link rel="stylesheet" href="kafle/kafle.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="bg-veil"></div>
  <div class="clock"><span class="clock-time" id="clockTime"></span><span class="clock-date" id="clockDate"></span></div>
  <nav class="top" id="top"></nav>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Wybierz „Edytuj” u góry i dodaj aplikacje.</div>
  <section class="editor" id="editor" hidden>
    <div class="ed-title">Ekran główny</div>
    <div class="ed-sub" id="edSub"></div>
    <div class="ed-list"><div class="ed-rows" id="edRows"></div></div>
    <div class="ed-side"><b>Jak to działa</b>Na ekranie mieści się osiem kafelków. Numer przy nazwie to miejsce na ekranie, licząc od lewej górnej.</div>
    <div class="ed-hint"><b>OK</b> dodaj lub usuń&nbsp;&nbsp;&nbsp;&nbsp;<b>← →</b> przesuń wcześniej lub później&nbsp;&nbsp;&nbsp;&nbsp;<b>Wstecz</b> gotowe</div>
  </section>
  <div class="toast" id="toast"></div>
</main>
<script src="device.js"></script>
<script src="kafle/kafle.js"></script>
</body>
</html>
